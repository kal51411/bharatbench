[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bharatbench"
version = "0.1.0"
description = "BharatBench - Indian LLM Evaluation Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "email-validator>=2.2.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "aiosqlite>=0.20.0",
    "greenlet>=3.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.1",
    "python-multipart>=0.0.9",
    "pandas>=2.2.3",
    "httpx>=0.27.2",
    "celery>=5.4.0",
    "redis>=5.1.0",
    "openai>=1.51.0",
    "google-generativeai>=0.8.3",
    "anthropic>=0.34.0",
    "python-dotenv>=1.0.1",
    "tenacity>=9.0.0",
    "scipy>=1.14.1",
    "numpy>=2.1.0",
    "jinja2>=3.1.4",
    "aiofiles>=24.1.0",
    "chardet>=5.2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.2",
    "factory-boy>=3.3.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
